<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/LogoUTN_Gestion_De_Eventos.png') }}?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='img/image.png') }}");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Cambiar todos los botones Bootstrap a azul */
        .btn-primary, .btn-primary:hover, .btn-primary:active, .btn-primary:focus {
            background-color: #04047f !important;
            border-color: #04047f !important;
        }
        .btn-secondary, .btn-secondary:hover, .btn-secondary:active, .btn-secondary:focus {
            background-color: #04047f !important;
            border-color: #04047f !important;
            color: white !important;
        }
        .btn-success, .btn-success:hover, .btn-success:active, .btn-success:focus {
            background-color: #04047f !important;
            border-color: #04047f !important;
        }
        .btn-info, .btn-info:hover, .btn-info:active, .btn-info:focus {
            background-color: #04047f !important;
            border-color: #04047f !important;
        }
        .btn-outline-primary, .btn-outline-primary:hover, .btn-outline-primary:active, .btn-outline-primary:focus {
            color: #04047f !important;
            border-color: #04047f !important;
        }
        .btn-outline-primary:hover {
            background-color: #04047f !important;
            color: white !important;
        }
        .btn-outline-secondary, .btn-outline-secondary:hover, .btn-outline-secondary:active, .btn-outline-secondary:focus {
            color: #04047f !important;
            border-color: #04047f !important;
        }
        .btn-outline-secondary:hover {
            background-color: #04047f !important;
            color: white !important;
        }

        /* Estilo vistas */
        body:not(.auth-page) .btn,
        body:not(.auth-page) button:not(.btn-close):not(.btn-check),
        body:not(.auth-page) .btn-usuarios,
        body:not(.auth-page) .btn-editar,
        body:not(.auth-page) .btn-eliminar {
            min-height: 42px;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            color: #04047f !important;
            background-color: transparent !important;
            border: 1px solid #04047f !important;
            box-shadow: 0 4px 12px rgba(4, 4, 127, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        body:not(.auth-page) .btn:hover,
        body:not(.auth-page) button:not(.btn-close):not(.btn-check):hover,
        body:not(.auth-page) .btn-usuarios:hover,
        body:not(.auth-page) .btn-editar:hover,
        body:not(.auth-page) .btn-eliminar:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 16px rgba(4, 4, 127, 0.18);
            color: #ffffff !important;
            background-color: #04047f !important;
        }

        body:not(.auth-page) .btn-danger,
        body:not(.auth-page) .btn-eliminar {
            color: #c0392b !important;
            border-color: #c0392b !important;
        }

        body:not(.auth-page) .btn-danger:hover,
        body:not(.auth-page) .btn-eliminar:hover {
            color: #ffffff !important;
            background-color: #c0392b !important;
        }

        body:not(.auth-page) .btn:focus-visible,
        body:not(.auth-page) button:not(.btn-close):not(.btn-check):focus-visible,
        body:not(.auth-page) .btn-usuarios:focus-visible,
        body:not(.auth-page) .btn-editar:focus-visible,
        body:not(.auth-page) .btn-eliminar:focus-visible {
            outline: 3px solid rgba(13, 110, 253, 0.28);
            outline-offset: 2px;
        }

        .btn-soporte {
            background-color: #04047f !important;
            color: #ffffff !important;
            border: none !important;
            padding: 10px 16px !important;
            border-radius: 6px !important;
            font-weight: 600 !important;
            transition: background-color 0.3s ease !important;
            display: inline-block !important;
            text-decoration: none !important;
        }
        .btn-soporte:hover {
            background-color: #03035f !important;
            color: #ffffff !important;
            text-decoration: none !important;
        }
        .btn-soporte:active {
            transform: scale(0.98);
        }
        .btn-cafecito {
            background-color: #f4a261 !important;
            color: #2d1b0e !important;
            border: none !important;
            padding: 10px 16px !important;
            border-radius: 6px !important;
            font-weight: 600 !important;
            transition: background-color 0.3s ease !important;
            display: inline-block !important;
            text-decoration: none !important;
        }
        .btn-cafecito:hover {
            background-color: #e76f51 !important;
            color: #ffffff !important;
            text-decoration: none !important;
        }
        .btn-cafecito:active {
            transform: scale(0.98);
        }
        .auth-action-button {
            min-height: 49px !important;
            border: 0 !important;
            border-radius: 8px !important;
            background: #1685e8 !important;
            color: #ffffff !important;
            box-shadow: 0 7px 15px rgba(22, 133, 232, 0.22) !important;
            font-weight: 700 !important;
        }
        .auth-action-button:hover,
        .auth-action-button:focus,
        .auth-action-button:active {
            background: #0874cf !important;
            color: #ffffff !important;
        }
    </style>
    {% block customCSS %}
    {% endblock %}
</head>

<body class="text-center {{ 'auth-page' if request.endpoint in ['login', 'register', 'forgot_password', 'reset_password', 'new_password'] else 'app-page' }}">
    {% if request.endpoint != 'home' %}
    {% endif %}
    {% if request.endpoint not in ['login', 'register'] %}
    <div style="position: fixed !important; bottom: 20px !important; left: 20px !important; right: 20px !important; z-index: 2000 !important; display: flex !important; gap: 8px !important; justify-content: space-between !important; align-items: center !important;">
        <a href="{{ config.CAFECITO_URL }}" class="btn-cafecito" target="_blank" rel="noopener noreferrer">Invitame un cafecito</a>
        <a href="{{ url_for('soporte') }}" class="btn-soporte" target="_blank" rel="noopener noreferrer">Soporte</a>
    </div>
    {% endif %}
    {% block body %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('permisos-solicitados')) return;
            sessionStorage.setItem('permisos-solicitados', 'true');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    localStorage.setItem('ubicacion_usuario', JSON.stringify({
                        latitud: position.coords.latitude,
                        longitud: position.coords.longitude
                    }));
                }, () => {}, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 300000
                });
            }

            if (navigator.storage && navigator.storage.persist) {
                navigator.storage.persist().catch(() => {});
            }
        });
    </script>
</body>

</html>
